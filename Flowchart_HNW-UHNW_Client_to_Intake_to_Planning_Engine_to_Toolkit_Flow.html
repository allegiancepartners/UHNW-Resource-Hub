<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: 788px 320px; margin: 0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:788px;height:320px;background:#fff}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .frame{
    position:relative;width:764px;height:296px;margin:12px;
    border:1px solid #dcdad2;border-radius:14px;background:#fff;
    overflow:hidden;
  }
  .title{
    position:absolute;top:24px;left:32px;
    font-size:15px;font-weight:700;color:#B8963E;letter-spacing:.01em;
  }
  .title .arrow{color:#B8963E;margin:0 3px;font-weight:700}
  .box{
    position:absolute;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px 14px;
  }
  .box.navy{background:#1B2A4A}
  .box.gold{background:#B8963E}
  .box .t{font-size:14.5px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.25}
  .box .s{font-size:11px;font-weight:400;color:#D7DEE9}
  .box.gold .s{color:#FBF3E1}

  #client{ left:267px; top:66px; width:230px; height:80px; }
  #intake{ left:32px; top:196px; width:221px; height:84px; }
  #engine{ left:271px; top:196px; width:221px; height:84px; }
  #toolkit{ left:510px; top:196px; width:221px; height:84px; }

  svg{position:absolute;top:0;left:0;overflow:visible}
  .lbl{
    position:absolute;font-size:11.5px;font-weight:700;color:#B8963E;
    background:#fff;padding:0 4px;white-space:nowrap;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="title">Client<span class="arrow">&rarr;</span>Intake<span class="arrow">&rarr;</span>Planning Engine<span class="arrow">&rarr;</span>Toolkit<span class="arrow">&rarr;</span>Client</div>

  <svg width="764" height="296">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#B8963E"/>
      </marker>
    </defs>
    <!-- Client -> Intake (kicks off) -->
    <line x1="307" y1="146" x2="162" y2="196" stroke="#B8963E" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Intake -> Planning Engine -->
    <line x1="253" y1="238" x2="271" y2="238" stroke="#B8963E" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Planning Engine -> Toolkit -->
    <line x1="492" y1="238" x2="510" y2="238" stroke="#B8963E" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Toolkit -> Client (delivered to) -->
    <line x1="600" y1="196" x2="437" y2="146" stroke="#B8963E" stroke-width="2" marker-end="url(#arrow)"/>
  </svg>

  <div class="lbl" style="left:195px;top:163px;">kicks off</div>
  <div class="lbl" style="left:488px;top:163px;">delivered to</div>

  <div id="client" class="box navy">
    <div class="t">HNW/UHNW Client</div>
    <div class="s">Initiates &amp; receives</div>
  </div>
  <div id="intake" class="box navy">
    <div class="t">Intake</div>
    <div class="s">Estate &amp; Tax Discovery Intake</div>
  </div>
  <div id="engine" class="box navy">
    <div class="t">Planning Engine</div>
    <div class="s">Freeze Model &middot; Tax Engine &middot; Appendices</div>
  </div>
  <div id="toolkit" class="box gold">
    <div class="t">Toolkit &amp;<br>Reference Library</div>
    <div class="s">Client-facing deliverables</div>
  </div>
</div>
</body>
</html>
